<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Reviewers
    </title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
          rel="stylesheet">

<style>

*{

    box-sizing:border-box;
}

body{

    margin:0;

    padding:20px;

    background:#f8fafc;

    font-family:'Inter', sans-serif;
}

.container{

    max-width:700px;

    margin:auto;
}

.card{

    background:white;

    border-radius:28px;

    padding:30px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.08);
}

.title{

    font-size:34px;

    font-weight:800;

    margin-bottom:12px;

    color:#0f172a;
}

.subtitle{

    color:#64748b;

    line-height:1.7;

    margin-bottom:28px;
}

.reviewer-btn{

    display:block;

    text-decoration:none;

    background:#eff6ff;

    color:#2563eb;

    padding:22px;

    border-radius:20px;

    font-weight:700;

    margin-bottom:18px;

    transition:0.15s ease;
}

.reviewer-btn:hover{

    transform:translateY(-2px);

    background:#dbeafe;
}

.back{

    display:inline-block;

    margin-top:10px;

    text-decoration:none;

    color:#2563eb;

    font-weight:700;
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="title">

            📚 Study Reviewers

        </div>

        <div class="subtitle">

            Study important Japan driving rules,
            safety guides, road signs,
            and exam explanations.

        </div>

        <a href="/road-signs-reviewer"
            class="reviewer-btn">

            🚧 Road Signs Reviewer

        <a href="/master-reviewer/1"
            class="reviewer-btn">

            📘 Master Reviewer 1

        </a>

        <a href="/master-reviewer/2"
            class="reviewer-btn">

            📗 Master Reviewer 2

        </a>

        <a href="/menu"
           class="back">

           ← Back to Menu

        </a>

    </div>

</div>

</body>

</html>
