<!DOCTYPE html>
<html>
<head>

    <title>Reset Password</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

<style>

body{

    font-family:Arial;

    background:#f5f7fb;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    margin:0;
}

.card{

    background:white;

    padding:30px;

    border-radius:20px;

    width:100%;

    max-width:400px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.08);
}

h1{

    text-align:center;
}

input{

    width:100%;

    padding:14px;

    margin-top:15px;

    border-radius:12px;

    border:
    1px solid #ccc;

    font-size:16px;
}

button{

    width:100%;

    padding:14px;

    margin-top:18px;

    border:none;

    border-radius:14px;

    background:#2563eb;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

.error{

    color:red;

    margin-top:10px;
}

.success{

    color:green;

    margin-top:10px;
}

</style>

</head>

<body>

<div class="card">

    <h1>Reset Password</h1>

    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}

    {% if success %}

        <div class="success">

            {{ success }}

        </div>

    {% endif %}

    <form method="POST">

        <input
            type="password"
            name="password"
            placeholder="New Password"
            required
        >

        <button type="submit">

            Update Password

        </button>

    </form>

</div>

</body>
</html>
