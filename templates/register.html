<!DOCTYPE html>
<html>
<head>

    <title>Register</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <!-- 📱 PWA -->

    <link rel="manifest"
          href="{{ url_for('static', filename='manifest.json') }}">

    <meta name="theme-color"
          content="#2563eb">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <meta name="apple-mobile-web-app-title"
          content="Driving Test Master">

    <link rel="apple-touch-icon"
          href="/static/images/icon.png?v=2">

    <!-- 🌐 FONT -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    font-family:'Inter', sans-serif;

    background:
    linear-gradient(
    180deg,
    #f8fbff 0%,
    #eef4fb 60%,
    #edf2f7 100%
    );

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    color:#0f172a;

    transition:
    background 0.2s ease,
    color 0.2s ease;

    -webkit-font-smoothing:antialiased;
}

/* 🌙 DARK MODE */

body.dark{

    background:
    linear-gradient(
    180deg,
    #0f172a 0%,
    #111827 100%
    );

    color:white;
}

body.dark .register-card{

    background:
    rgba(15,23,42,0.92);

    border:
    1px solid rgba(255,255,255,0.08);
}

body.dark input{

    background:#1e293b;

    border:
    1px solid #334155;

    color:white;
}

body.dark input::placeholder{

    color:#94a3b8;
}

body.dark .subtitle{

    color:#cbd5e1;
}

body.dark .login-link,
body.dark .back-link{

    color:#93c5fd;
}

/* 📦 REGISTER CARD */

.register-card{

    width:100%;

    max-width:440px;

    background:
    rgba(255,255,255,0.78);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:
    1px solid rgba(255,255,255,0.55);

    border-radius:30px;

    padding:34px 28px;

    box-shadow:
    0 12px 32px rgba(15,23,42,0.08);

    animation:fadeIn 0.2s ease;
}

@keyframes fadeIn{

    from{

        opacity:0;
        transform:translateY(8px);
    }

    to{

        opacity:1;
        transform:translateY(0);
    }
}

/* ⬅ BACK BUTTON */

.back{

    margin-bottom:18px;
}

.back-link{

    text-decoration:none;

    color:#2563eb;

    font-size:15px;

    font-weight:700;

    transition:opacity 0.1s ease;
}

.back-link:hover{

    opacity:0.8;
}

/* 🏁 TITLE */

.title{

    text-align:center;

    font-size:30px;

    font-weight:800;

    letter-spacing:-1px;

    margin-bottom:8px;
}

.subtitle{

    text-align:center;

    color:#64748b;

    font-size:15px;

    margin-bottom:28px;

    line-height:1.6;
}

/* ⚠ ERROR */

.error{

    background:#fef2f2;

    border:
    1px solid #fecaca;

    color:#dc2626;

    padding:14px;

    border-radius:16px;

    margin-bottom:18px;

    font-size:14px;

    font-weight:600;
}

/* 📝 FORM */

form{

    display:flex;

    flex-direction:column;

    gap:16px;
}

/* ✏ INPUT */

input{

    width:100%;

    padding:16px 18px;

    border-radius:18px;

    border:
    1px solid #dbe4f0;

    font-size:16px;

    font-family:'Inter', sans-serif;

    outline:none;

    transition:
    border 0.1s ease,
    box-shadow 0.1s ease;

    appearance:none;
    -webkit-appearance:none;
}

input:focus{

    border:
    1px solid #3b82f6;

    box-shadow:
    0 0 0 4px rgba(59,130,246,0.12);
}

/* 🔘 BUTTON */

button{

    width:100%;

    border:none;

    padding:16px;

    border-radius:20px;

    font-size:17px;

    font-weight:800;

    color:white;

    cursor:pointer;

    background:
    linear-gradient(
    135deg,
    #3b82f6,
    #2563eb
    );

    box-shadow:
    0 10px 24px rgba(37,99,235,0.2);

    transition:
    transform 0.05s ease,
    opacity 0.05s ease;

    touch-action:manipulation;
}

button:hover{

    opacity:0.97;
}

button:active{

    transform:scale(0.985);
}

button:disabled{

    opacity:0.7;

    cursor:not-allowed;

    transform:none;
}

/* 🔗 LOGIN */

.login{

    margin-top:24px;

    text-align:center;

    font-size:15px;
}

.login-link{

    color:#2563eb;

    text-decoration:none;

    font-weight:700;
}

/* 🌙 DARK BUTTON */

.dark-btn{

    position:fixed;

    bottom:20px;

    right:20px;

    width:58px;

    height:58px;

    border:none;

    border-radius:50%;

    font-size:22px;

    cursor:pointer;

    color:white;

    background:
    linear-gradient(
    135deg,
    #334155,
    #1e293b
    );

    box-shadow:
    0 10px 24px rgba(15,23,42,0.25);

    touch-action:manipulation;
}

/* 📱 MOBILE */

@media(max-width:600px){

    .register-card{

        padding:28px 22px;
    }

    .title{

        font-size:26px;
    }

    input{

        font-size:16px;
    }

    button{

        font-size:16px;
    }
}

</style>

</head>

<body>

<div class="register-card">

    <!-- ⬅ BACK -->

    <div class="back">

        <a href="/menu"
           class="back-link">

           ← Back to Menu

        </a>

    </div>

    <div class="title">
        🚗 Create Account
    </div>

    <div class="subtitle">

        Create your account and start
        mastering the Japan driving test.

    </div>

    {% if error %}

        <div class="error">

            ⚠ {{ error }}

        </div>

    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            autocomplete="username"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email Address"
            autocomplete="email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            autocomplete="new-password"
            required
        >

        <button
            type="submit"
            id="submitBtn">

            📝 Register

        </button>

    </form>

    <div class="login">

        Already have an account?

        <a href="/login"
           class="login-link">

           Login Here

        </a>

    </div>

</div>

<!-- 🌙 DARK BUTTON -->

<button
    class="dark-btn"
    onclick="toggleDarkMode()">

    🌙

</button>

<!-- 🌙 DARK MODE -->

<script>

function toggleDarkMode(){

    document.body.classList.toggle(
        "dark"
    );

    localStorage.setItem(

        "darkMode",

        document.body.classList.contains(
            "dark"
        )
    );
}

/* ✅ LOAD SAVED DARK MODE */

if(

    localStorage.getItem(
        "darkMode"
    ) === "true"
){

    document.body.classList.add(
        "dark"
    );
}

</script>

<!-- ⏳ LOADING BUTTON -->

<script>

const form =
    document.querySelector("form");

if(form){

    form.addEventListener(

        "submit",

        function(){

            const btn =
                document.getElementById(
                    "submitBtn"
                );

            btn.innerHTML =
                "⏳ Creating Account...";

            btn.disabled = true;
        }
    );
}

</script>

<!-- 📱 SERVICE WORKER -->

<script>

if('serviceWorker' in navigator){

    navigator.serviceWorker.register(
        '/static/service-worker.js'
    );
}

</script>

</body>
</html>
