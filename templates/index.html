<!DOCTYPE html>
<html>
<head>
    <title>Driving Test</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
    body {
        font-family: Arial;
        max-width: 600px;
        margin: auto;
        padding: 20px;
    }
    button {
        padding: 10px 20px;
        background: #2d89ef;
        color: white;
        border: none;
        border-radius: 5px;
    }
    </style>

</head>
<body>

    <h2>Japan Driving Test Practice</h2>

    <form method="POST" action="/submit">
        {% for q in questions %}
            {% set q_index = loop.index0 %}

            <p><b>{{ q.question }}</b></p>

            {% for choice in q.choices %}
                <input type="radio" name="{{ q_index }}" value="{{ choice }}" required>
                {{ choice }}<br>
            {% endfor %}
        {% endfor %}

        <br>
        <button type="submit">Submit</button>
    </form>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/service-worker.js');
}
</script>

</body>
</html>
