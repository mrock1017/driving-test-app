<!DOCTYPE html>
<html>
<head>

    <title>Forgot Password</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
    linear-gradient(
    180deg,
    #f8fbff 0%,
    #eef4fb 60%,
    #edf2f7 100%
    );

    font-family:'Inter', sans-serif;

    padding:20px;
}

.card{

    width:100%;

    max-width:420px;

    background:white;

    padding:32px;

    border-radius:28px;

    box-shadow:
    0 12px 30px rgba(15,23,42,0.08);
}

.title{

    font-size:28px;

    font-weight:800;

    margin-bottom:10px;

    text-align:center;
}

.subtitle{

    text-align:center;

    color:#64748b;

    margin-bottom:24px;

    line-height:1.6;
}

.success{

    background:#ecfdf5;

    color:#16a34a;

    padding:14px;

    border-radius:16px;

    margin-bottom:18px;

    font-weight:600;
}

input{

    width:100%;

    padding:16px;

    border-radius:18px;

    border:
    1px solid #dbe4f0;

    font-size:16px;

    margin-bottom:18px;

    outline:none;
}

button{

    width:100%;

    border:none;

    padding:16px;

    border-radius:20px;

    font-size:17px;

    font-weight:800;

    color:white;

    cursor:pointer;

    background:
    linear-gradient(
    135deg,
    #3b82f6,
    #2563eb
    );
}

.back{

    text-align:center;

    margin-top:20px;
}

.back a{

    color:#2563eb;

    text-decoration:none;

    font-weight:700;
}

</style>

</head>

<body>

<div class="card">

    <div class="title">

        🔑 Forgot Password

    </div>

    <div class="subtitle">

        Enter your email address
        to receive a password reset link.

    </div>

    {% if message %}

    <div class="success">

        {{ message }}

    </div>

    {% endif %}

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
        >

        <button type="submit">

            Send Reset Link

        </button>

    </form>

    <div class="back">

        <a href="/login">

            ← Back to Login

        </a>

    </div>

</div>

</body>
</html>
