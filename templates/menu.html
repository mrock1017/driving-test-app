<!DOCTYPE html>
<html>
<head>

    <title>Driving Test App</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

*{
    box-sizing:border-box;
}

body{
    font-family:'Inter', sans-serif;

    background:
    linear-gradient(
    180deg,
    #f8fbff,
    #eef3f9
    );

    margin:0;

    color:#222;
}

/* 🔝 HEADER */

.header{

    background:rgba(255,255,255,0.75);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    padding:28px;

    text-align:center;

    font-size:30px;

    font-weight:800;

    letter-spacing:-1px;

    position:sticky;
    top:0;
    z-index:100;

    border-bottom-left-radius:28px;
    border-bottom-right-radius:28px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.08);
}

/* 📦 CONTAINER */

.container{
    max-width:540px;
    margin:auto;
    padding:22px;
}

/* 📦 CARDS */

.card{

    background:rgba(255,255,255,0.72);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,0.35);

    border-radius:28px;

    padding:28px;

    margin-bottom:30px;

    box-shadow:
    0 12px 35px rgba(0,0,0,0.08),
    0 3px 10px rgba(0,0,0,0.04);
}

/* 🏷 TITLES */

h2{
    margin-top:0;
    margin-bottom:22px;

    font-size:22px;

    font-weight:700;

    letter-spacing:-0.5px;

    color:#444;
}

/* 🔘 BUTTONS */

.menu-btn{

    display:block;

    text-decoration:none;

    padding:18px;

    border-radius:18px;

    margin-top:16px;

    font-size:21px;

    font-weight:600;

    text-align:center;

    color:white;

    background:
    linear-gradient(
    135deg,
    #4facfe,
    #007bff
    );

    box-shadow:
    0 10px 20px rgba(0,123,255,0.22);

    transition:
    transform 0.15s ease,
    box-shadow 0.15s ease,
    opacity 0.15s ease;
}

/* 🟣 HONMEN */

.menu-btn-secondary{

    background:
    linear-gradient(
    135deg,
    #8e8dff,
    #6c63ff
    );

    box-shadow:
    0 10px 20px rgba(108,99,255,0.25);
}

/* 🟢 REVIEW */

.menu-btn-green{

    background:
    linear-gradient(
    135deg,
    #43e97b,
    #27ae60
    );

    box-shadow:
    0 10px 20px rgba(39,174,96,0.22);
}

/* ✨ HOVER */

.menu-btn:hover{

    transform:translateY(-2px);

    opacity:0.96;
}

/* 👆 TAP EFFECT */

.menu-btn:active{

    transform:scale(0.97);
}

/* 🌙 DARK MODE */

@media (prefers-color-scheme: dark){

    body{

        background:
        linear-gradient(
        180deg,
        #0f172a,
        #111827
        );

        color:white;
    }

    .header{

        background:rgba(15,23,42,0.7);

        color:white;
    }

    .card{

        background:rgba(30,41,59,0.65);

        border:1px solid rgba(255,255,255,0.08);
    }

    h2{
        color:#e5e7eb;
    }
}

</style>
</head>

<body>

<div class="header">
    🚗 Driving Test App
</div>

<div class="container">

    <!-- 🧠 Reviewer -->
    <div class="card">

        <h2>Study Mode</h2>

        <a href="/start/reviewer_karimen/reviewer_karimen"
           class="menu-btn menu-btn-green">
           🧠 Reviewer Karimen
        </a>

        <a href="/start/reviewer_honmen/reviewer_honmen"
           class="menu-btn menu-btn-green">
           🧠 Reviewer Honmen
        </a>

    </div>

    <!-- 📝 Karimen -->
    <div class="card">

        <h2>Karimen Mock Test</h2>

        <a href="/start/karimen/karimen_1"
           class="menu-btn">
           📝 Karimen Test 1
        </a>

        <a href="/start/karimen/karimen_2"
           class="menu-btn">
           📝 Karimen Test 2
        </a>

        <a href="/start/karimen/karimen_3"
           class="menu-btn">
           📝 Karimen Test 3
        </a>

        <a href="/start/karimen/karimen_4"
           class="menu-btn">
           📝 Karimen Test 4
        </a>

    </div>

    <!-- 🏁 Honmen -->
    <div class="card">

        <h2>Honmen Mock Test</h2>

        <a href="/start/honmen/honmen_1"
           class="menu-btn menu-btn-secondary">
           🏁 Honmen Test 1
        </a>

        <a href="/start/honmen/honmen_2"
           class="menu-btn menu-btn-secondary">
           🏁 Honmen Test 2
        </a>

        <a href="/start/honmen/honmen_3"
           class="menu-btn menu-btn-secondary">
           🏁 Honmen Test 3
        </a>

    </div>

</div>

</body>
</html>
