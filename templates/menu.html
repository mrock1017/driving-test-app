<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>Driving Test App</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

    body{
        font-family: 'Inter', sans-serif;
        background:#f5f7fa;
        margin:0;
    }

    .header{
        background:white;
        padding:25px;
        text-align:center;
        font-size:26px;
        font-weight:bold;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    .container{
        max-width:500px;
        margin:auto;
        padding:15px;
    }

    .card{
        background:white;
        border-radius:20px;
        padding:25px;
        margin-bottom:25px;
        box-shadow:0 3px 10px rgba(0,0,0,0.06);
    }

    h2{
        margin-top:0;
        color:#555;
    }

    .menu-btn{
        display:block;
        text-decoration:none;
        padding:15px;
        border-radius:12px;
        margin-top:12px;
        font-size:20px;
        text-align:center;
        color:white;
        background:#2d89ef;
    }

    .menu-btn:hover{
        opacity:0.9;
    }

    .menu-btn-secondary{
        background:#6c63ff;
    }

    .menu-btn-green{
        background:#27ae60;
    }

    </style>
</head>

<body>

<div class="header">
    🚗 Driving Test App
</div>

<div class="container">

    <!-- 🧠 Reviewer -->
    <div class="card">

        <h2>Study Mode</h2>

        <a href="/start/reviewer_karimen/reviewer_karimen"
           class="menu-btn menu-btn-green">
           🧠 Reviewer Karimen
        </a>

        <a href="/start/reviewer_honmen/reviewer_honmen"
           class="menu-btn menu-btn-green">
           🧠 Reviewer Honmen
        </a>

    </div>

    <!-- 📝 Karimen -->
    <div class="card">

        <h2>Karimen Mock Test</h2>

        <a href="/start/karimen/karimen_1"
           class="menu-btn">
           📝 Karimen Test 1
        </a>

        <a href="/start/karimen/karimen_2"
           class="menu-btn">
           📝 Karimen Test 2
        </a>

        <a href="/start/karimen/karimen_3"
           class="menu-btn">
           📝 Karimen Test 3
        </a>

        <a href="/start/karimen/karimen_4"
           class="menu-btn">
           📝 Karimen Test 4
        </a>

    </div>

    <!-- 🏁 Honmen -->
    <div class="card">

        <h2>Honmen Mock Test</h2>

        <a href="/start/honmen/honmen_1"
           class="menu-btn menu-btn-secondary">
           🏁 Honmen Test 1
        </a>

        <a href="/start/honmen/honmen_2"
           class="menu-btn menu-btn-secondary">
           🏁 Honmen Test 2
        </a>

        <a href="/start/honmen/honmen_3"
           class="menu-btn menu-btn-secondary">
           🏁 Honmen Test 3
        </a>

    </div>

</div>

</body>
</html>
