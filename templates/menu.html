<!DOCTYPE html>
<html>
<head>

    <link rel="apple-touch-icon" href="/static/images/icon.png?v=2">

    <title>Japan Driving Test Master</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{

    font-family:'Inter', sans-serif;

    background:
    linear-gradient(
    180deg,
    #f7faff 0%,
    #eef4fb 55%,
    #edf2f7 100%
    );

    margin:0;

    color:#1e293b;

    min-height:100vh;
}

/* 🔝 HEADER */

.header{

    position:sticky;
    top:0;
    z-index:100;

    padding:22px 20px;

    text-align:center;

    font-size:28px;

    font-weight:800;

    letter-spacing:-1px;

    color:#0f172a;

    background:
    rgba(255,255,255,0.82);

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    border-bottom-left-radius:24px;
    border-bottom-right-radius:24px;

    box-shadow:
    0 8px 28px rgba(15,23,42,0.06);
}

/* 📦 CONTAINER */

.container{

    max-width:540px;

    margin:auto;

    padding:18px 16px 40px;
}

/* 📦 CARD */

.card{

    background:
    rgba(255,255,255,0.72);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:
    1px solid rgba(255,255,255,0.5);

    border-radius:28px;

    padding:24px 20px;

    margin-bottom:22px;

    box-shadow:
    0 10px 30px rgba(15,23,42,0.05);

    transition:
    transform 0.18s ease,
    box-shadow 0.18s ease;
}

.card:hover{

    transform:translateY(-2px);

    box-shadow:
    0 14px 36px rgba(15,23,42,0.08);
}

/* 🏷 TITLES */

h2{

    margin-top:0;
    margin-bottom:18px;

    font-size:20px;

    font-weight:800;

    letter-spacing:-0.6px;

    color:#334155;
}

/* 🔘 BUTTONS */

.menu-btn{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    text-decoration:none;

    padding:14px 18px;

    min-height:58px;

    border-radius:18px;

    margin-top:14px;

    font-size:18px;

    font-weight:700;

    letter-spacing:-0.3px;

    text-align:center;

    color:white;

    background:
    linear-gradient(
    135deg,
    #3b82f6,
    #2563eb
    );

    border:
    1px solid rgba(255,255,255,0.08);

    box-shadow:
    0 8px 20px rgba(37,99,235,0.18);

    transition:
    transform 0.12s ease,
    opacity 0.12s ease,
    box-shadow 0.12s ease;
}

/* 🟣 HONMEN */

.menu-btn-secondary{

    background:
    linear-gradient(
    135deg,
    #7c3aed,
    #6d28d9
    );

    box-shadow:
    0 8px 20px rgba(109,40,217,0.18);
}

/* 🟢 REVIEW */

.menu-btn-green{

    background:
    linear-gradient(
    135deg,
    #22c55e,
    #16a34a
    );

    box-shadow:
    0 8px 20px rgba(22,163,74,0.18);
}

/* ✨ HOVER */

.menu-btn:hover{

    transform:translateY(-1px);

    opacity:0.97;
}

/* 👆 TAP EFFECT */

.menu-btn:active{

    transform:scale(0.985);
}

/* 📱 MOBILE */

@media(max-width:600px){

    .header{

        font-size:24px;

        padding:20px 16px;
    }

    .card{

        padding:22px 18px;
    }

    h2{

        font-size:18px;
    }

    .menu-btn{

        font-size:17px;

        min-height:54px;

        padding:13px 16px;
    }
}

    </style>

</head>

<body>

<div class="header">
    🚗 Driving Test App
</div>

<div class="container">

    <!-- 🧠 Reviewer -->
    <div class="card">

        <h2>Study Mode</h2>

        <a href="/start/reviewer_karimen/reviewer_karimen"
           class="menu-btn menu-btn-green">
           🧠 Reviewer Karimen
        </a>

        <a href="/start/reviewer_honmen/reviewer_honmen"
           class="menu-btn menu-btn-green">
           🧠 Reviewer Honmen
        </a>

    </div>

    <!-- 📝 Karimen -->
    <div class="card">

        <h2>Karimen Mock Test</h2>

        <a href="/start/karimen/karimen_1"
           class="menu-btn">
           📝 Karimen Test 1
        </a>

        <a href="/start/karimen/karimen_2"
           class="menu-btn">
           📝 Karimen Test 2
        </a>

        <a href="/start/karimen/karimen_3"
           class="menu-btn">
           📝 Karimen Test 3
        </a>

        <a href="/start/karimen/karimen_4"
           class="menu-btn">
           📝 Karimen Test 4
        </a>

    </div>

    <!-- 🏁 Honmen -->
    <div class="card">

        <h2>Honmen Mock Test</h2>

        <a href="/start/honmen/honmen_1"
           class="menu-btn menu-btn-secondary">
           🏁 Honmen Test 1
        </a>

        <a href="/start/honmen/honmen_2"
           class="menu-btn menu-btn-secondary">
           🏁 Honmen Test 2
        </a>

        <a href="/start/honmen/honmen_3"
           class="menu-btn menu-btn-secondary">
           🏁 Honmen Test 3
        </a>

    </div>

</div>

</body>
</html>
