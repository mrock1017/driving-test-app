<!DOCTYPE html>
<html>
<head>

    <title>Driving Test App</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{

    font-family:'Inter', sans-serif;

    background:
    linear-gradient(
    180deg,
    #f8fbff 0%,
    #edf4ff 45%,
    #eef2f7 100%
    );

    margin:0;

    color:#1e293b;

    min-height:100vh;
}

/* 🔝 HEADER */

.header{

    position:sticky;
    top:0;
    z-index:100;

    padding:30px 24px;

    text-align:center;

    font-size:32px;

    font-weight:800;

    letter-spacing:-1.2px;

    color:#0f172a;

    background:
    rgba(255,255,255,0.78);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom-left-radius:30px;
    border-bottom-right-radius:30px;

    box-shadow:
    0 10px 40px rgba(15,23,42,0.08);
}

/* 📦 CONTAINER */

.container{

    max-width:560px;

    margin:auto;

    padding:24px 18px 40px;
}

/* 📦 CARD */

.card{

    position:relative;

    overflow:hidden;

    background:
    rgba(255,255,255,0.72);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:
    1px solid rgba(255,255,255,0.45);

    border-radius:30px;

    padding:30px 24px;

    margin-bottom:28px;

    box-shadow:
    0 15px 45px rgba(15,23,42,0.08),
    0 4px 12px rgba(15,23,42,0.04);

    transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.card:hover{

    transform:translateY(-3px);

    box-shadow:
    0 20px 55px rgba(15,23,42,0.10),
    0 8px 20px rgba(15,23,42,0.06);
}

/* ✨ GLOW EFFECT */

.card::before{

    content:"";

    position:absolute;

    width:160px;
    height:160px;

    background:
    radial-gradient(
    rgba(255,255,255,0.7),
    transparent 70%
    );

    top:-70px;
    right:-70px;

    pointer-events:none;
}

/* 🏷 TITLES */

h2{

    margin-top:0;
    margin-bottom:22px;

    font-size:26px;

    font-weight:800;

    letter-spacing:-0.8px;

    color:#334155;
}

/* 🔘 BUTTONS */

.menu-btn{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:12px;

    text-decoration:none;

    padding:20px;

    border-radius:22px;

    margin-top:16px;

    font-size:21px;

    font-weight:700;

    text-align:center;

    color:white;

    background:
    linear-gradient(
    135deg,
    #55b4ff,
    #007bff
    );

    box-shadow:
    0 12px 25px rgba(0,123,255,0.25);

    transition:
    transform 0.15s ease,
    box-shadow 0.15s ease,
    opacity 0.15s ease;
}

/* 🟣 HONMEN */

.menu-btn-secondary{

    background:
    linear-gradient(
    135deg,
    #9a8cff,
    #6c63ff
    );

    box-shadow:
    0 12px 25px rgba(108,99,255,0.28);
}

/* 🟢 REVIEW */

.menu-btn-green{

    background:
    linear-gradient(
    135deg,
    #49e58a,
    #1fa75d
    );

    box-shadow:
    0 12px 25px rgba(39,174,96,0.24);
}

/* ✨ HOVER */

.menu-btn:hover{

    transform:
    translateY(-2px);

    opacity:0.97;
}

/* 👆 TAP EFFECT */

.menu-btn:active{

    transform:
    scale(0.97);

    box-shadow:
    0 5px 12px rgba(0,0,0,0.16);
}

/* 📱 MOBILE */

@media(max-width:600px){

    .header{

        font-size:28px;

        padding:26px 20px;
    }

    .card{

        padding:26px 20px;
    }

    h2{

        font-size:22px;
    }

    .menu-btn{

        font-size:19px;

        padding:18px;
    }
}

/* 🌙 DARK MODE */

@media (prefers-color-scheme: dark){

    body{

        background:
        linear-gradient(
        180deg,
        #020617,
        #0f172a 45%,
        #111827
        );

        color:white;
    }

    .header{

        background:
        rgba(2,6,23,0.72);

        color:white;

        box-shadow:
        0 10px 40px rgba(0,0,0,0.45);
    }

    .card{

        background:
        rgba(15,23,42,0.72);

        border:
        1px solid rgba(255,255,255,0.06);

        box-shadow:
        0 14px 40px rgba(0,0,0,0.35);
    }

    h2{

        color:#f1f5f9;
    }
}

    </style>

</head>

<body>

<div class="header">
    🚗 Driving Test App
</div>

<div class="container">

    <!-- 🧠 Reviewer -->
    <div class="card">

        <h2>Study Mode</h2>

        <a href="/start/reviewer_karimen/reviewer_karimen"
           class="menu-btn menu-btn-green">
           🧠 Reviewer Karimen
        </a>

        <a href="/start/reviewer_honmen/reviewer_honmen"
           class="menu-btn menu-btn-green">
           🧠 Reviewer Honmen
        </a>

    </div>

    <!-- 📝 Karimen -->
    <div class="card">

        <h2>Karimen Mock Test</h2>

        <a href="/start/karimen/karimen_1"
           class="menu-btn">
           📝 Karimen Test 1
        </a>

        <a href="/start/karimen/karimen_2"
           class="menu-btn">
           📝 Karimen Test 2
        </a>

        <a href="/start/karimen/karimen_3"
           class="menu-btn">
           📝 Karimen Test 3
        </a>

        <a href="/start/karimen/karimen_4"
           class="menu-btn">
           📝 Karimen Test 4
        </a>

    </div>

    <!-- 🏁 Honmen -->
    <div class="card">

        <h2>Honmen Mock Test</h2>

        <a href="/start/honmen/honmen_1"
           class="menu-btn menu-btn-secondary">
           🏁 Honmen Test 1
        </a>

        <a href="/start/honmen/honmen_2"
           class="menu-btn menu-btn-secondary">
           🏁 Honmen Test 2
        </a>

        <a href="/start/honmen/honmen_3"
           class="menu-btn menu-btn-secondary">
           🏁 Honmen Test 3
        </a>

    </div>

</div>

</body>
</html>
