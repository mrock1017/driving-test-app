<!DOCTYPE html>
<html>
<head>

    <title>Score History</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{

    font-family:Arial;

    background:#f5f7fb;

    margin:0;

    padding:20px;
}

.container{

    max-width:700px;

    margin:auto;
}

.card{

    background:white;

    border-radius:20px;

    padding:20px;

    box-shadow:
    0 4px 20px rgba(0,0,0,0.08);
}

h1{

    text-align:center;

    margin-bottom:25px;
}

.back-btn{

    display:block;

    text-align:center;

    margin-top:25px;

    text-decoration:none;

    background:#2563eb;

    color:white;

    padding:14px;

    border-radius:12px;

    font-weight:bold;
}

.history-item{

    margin-top:15px;

    padding:14px;

    border-radius:12px;

    background:#f8fafc;
}

.pass{

    color:green;

    font-weight:bold;
}

.fail{

    color:red;

    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>📊 Score History</h1>

        <canvas id="scoreChart"></canvas>

        {% for item in history %}

        <div class="history-item">

            <strong>{{ item.mode }}</strong><br>

            Score:
            {{ item.score }}/{{ item.total }}

            <br>

            Status:

            {% if item.passed %}

                <span class="pass">PASSED</span>

            {% else %}

                <span class="fail">FAILED</span>

            {% endif %}

            <br>

            {{ item.time }}

        </div>

        {% endfor %}

        <a href="/menu"
           class="back-btn">

           ⬅ Back to Menu

        </a>

    </div>

</div>

<script>

const historyData = [

    {% for item in history %}

    {
        score: {{ item.score }},
        total: {{ item.total }},
        label: "{{ item.time }}"
    },

    {% endfor %}
];

const labels = historyData.map(
    item => item.label
);

const scores = historyData.map(
    item => item.score
);

const totals = historyData.map(
    item => item.total
);

new Chart(

    document.getElementById('scoreChart'),

    {

        type: 'line',

        data: {

            labels: labels,

            datasets: [

                {

                    label: 'Score',

                    data: scores,

                    tension: 0.3,

                    borderWidth: 3,

                    fill: false
                }
            ]
        },

        options: {

            responsive: true,

            plugins: {

                legend: {

                    display: true
                }
            },

            scales: {

                y: {

                    beginAtZero: true
                }
            }
        }
    }
);

</script>

</body>
</html>
