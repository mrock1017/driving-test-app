<!DOCTYPE html>
<html lang="pt">

<head>

    <!-- ======================================================
       META
  ====================================================== -->

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
        Japan Driving Test Master
    </title>

    <!-- ======================================================
       GOOGLE FONT
  ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- ======================================================
       CSS
  ====================================================== -->

    <style>
        /* ======================================================
       RESET
    ====================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            font-family: 'Inter', sans-serif;

            background:
                radial-gradient(circle at top left, #1d4ed8 0%, transparent 25%),
                radial-gradient(circle at top right, #7c3aed 0%, transparent 25%),
                linear-gradient(180deg, #071120 0%, #0d1728 100%);

            color: #fff;

            min-height: 100vh;

            overflow-x: hidden;

            transition: 0.35s ease;
        }

        body.light-mode {

            background:
                radial-gradient(circle at top left, #dbeafe 0%, transparent 25%),
                radial-gradient(circle at top right, #ede9fe 0%, transparent 25%),
                linear-gradient(180deg, #f8fbff 0%, #eef2ff 100%);

            color: #111827;
        }

        img {
            display: block;
            max-width: 100%;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }

        /* ======================================================
       APP
    ====================================================== */

        .app {
            width: 100%;
            max-width: 1500px;
            margin: auto;
            padding: 20px;
        }

        /* ======================================================
       HERO
    ====================================================== */

        .hero {

            position: relative;

            overflow: hidden;

            border-radius: 34px;

            padding: 34px 26px;

            margin-bottom: 24px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.12);

            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.28),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);
        }

        body.light-mode .hero {
            background: rgba(255, 255, 255, 0.78);
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
        }

        .hero-title {

            font-size:
                clamp(2.2rem, 5vw, 4.6rem);

            line-height: 1.05;

            font-weight: 800;

            margin-bottom: 14px;
        }

        .hero-description {

            max-width: 760px;

            line-height: 1.9;

            opacity: 0.92;

            font-size: 1rem;
        }

        /* ======================================================
       THEME BUTTON
    ====================================================== */

        .theme-btn {

            width: 58px;
            height: 58px;

            border-radius: 18px;

            background: rgba(255, 255, 255, 0.1);

            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.12);

            color: #fff;

            font-size: 1.2rem;

            transition: 0.3s ease;
        }

        body.light-mode .theme-btn {
            background: #fff;
            color: #111827;
        }

        .theme-btn:hover {
            transform: translateY(-3px);
        }

        .back-btn {

            padding: 14px 20px;

            border-radius: 18px;

            background: rgba(255, 255, 255, 0.1);

            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.12);

            color: #fff;

            font-weight: 700;

            transition: 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-3px);
        }

        body.light-mode .back-btn {
            background: #fff;
            color: #111827;
        }

        /* ======================================================
       SEARCH
    ====================================================== */

        .search-wrapper {
            position: relative;
            margin-top: 28px;
        }

        .search-input {

            width: 100%;

            padding: 18px 20px 18px 58px;

            border-radius: 22px;

            border: none;
            outline: none;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.12);

            color: #fff;

            font-size: 1rem;
        }

        body.light-mode .search-input {
            background: #fff;
            color: #111827;
        }

        .search-icon {

            position: absolute;

            left: 20px;
            top: 50%;

            transform: translateY(-50%);

            opacity: 0.75;
        }

        /* ======================================================
       CATEGORY NAVIGATION
    ====================================================== */

        .sticky-nav {

            position: sticky;

            top: 0;

            z-index: 100;

            padding: 14px 0;

            backdrop-filter: blur(18px);
        }

        .tabs {

            display: flex;

            gap: 12px;

            overflow-x: auto;

            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {

            white-space: nowrap;

            padding: 12px 20px;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.12);

            color: #fff;

            font-weight: 700;

            transition: 0.3s ease;
        }

        body.light-mode .tab {
            background: #fff;
            color: #111827;
        }

        .tab.active {

            background:
                linear-gradient(135deg,
                    #2563eb,
                    #7c3aed);

            border: none;
        }

        /* ======================================================
       GRID
    ====================================================== */

        .grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(270px, 1fr));

            gap: 22px;

            margin-top: 24px;
        }

        /* ======================================================
       CARD
    ====================================================== */

        .card {

            position: relative;

            overflow: hidden;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.12);

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.22);

            transition: 0.35s ease;

            animation: fadeIn 0.35s ease;
        }

        body.light-mode .card {
            background: rgba(255, 255, 255, 0.78);
        }

        .card:hover {

            transform: translateY(-6px);

            box-shadow:
                0 25px 45px rgba(0, 0, 0, 0.25);
        }

        .card,
        .expand-btn,
        .theme-btn {
            will-change: transform;
        }

        /* ======================================================
       CARD TOP
    ====================================================== */

        .card-top {

            min-height: 190px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

            background:
                linear-gradient(135deg,
                    rgba(255, 255, 255, 0.08),
                    rgba(255, 255, 255, 0.03));
        }

        .card-top img {

            width: 115px;
            height: 115px;

            object-fit: contain;

            transition: 0.3s ease;
        }

        .card:hover img {
            transform: scale(1.06);
        }

        /* ======================================================
       CARD BODY
    ====================================================== */

        .card-body {
            padding: 22px;
        }

        .category {

            display: inline-flex;

            align-items: center;

            padding: 8px 13px;

            border-radius: 999px;

            background: rgba(59, 130, 246, 0.2);

            color: #93c5fd;

            font-size: 0.76rem;

            font-weight: 700;

            margin-bottom: 14px;
        }

        body.light-mode .category {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .sign-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .sign-jp {
            opacity: 0.75;
            margin-bottom: 14px;
        }

        .description {
            line-height: 1.7;
            opacity: 0.92;
            font-size: 0.95rem;
        }

        /* ======================================================
       EXPAND BUTTON
    ====================================================== */

        .expand-btn {

            width: 100%;

            margin-top: 18px;

            padding: 13px;

            border-radius: 18px;

            background:
                linear-gradient(135deg,
                    #2563eb,
                    #7c3aed);

            color: #fff;

            font-weight: 700;

            transition: 0.3s ease;
        }

        .expand-btn:hover {
            transform: translateY(-2px);
        }

        /* ======================================================
       LEARN MORE
    ====================================================== */

        .extra {

            max-height: 0;

            overflow: hidden;

            transition: max-height 0.45s ease;
        }

        .extra.open {
            max-height: 1600px;
        }

        .learn-box {

            margin-top: 18px;

            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .learn-section {

            padding: 15px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.06);

            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        body.light-mode .learn-section {
            background: rgba(255, 255, 255, 0.85);
        }

        .learn-section h4 {

            margin-bottom: 8px;

            font-size: 0.92rem;

            font-weight: 700;
        }

        .learn-section p {

            line-height: 1.75;

            font-size: 0.92rem;

            opacity: 0.9;
        }

        /* ======================================================
       LISTS
    ====================================================== */

        .learn-list {

            margin-top: 12px;

            padding-left: 18px;

            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .learn-list li {

            line-height: 1.7;

            font-size: 0.9rem;

            opacity: 0.9;
        }

        /* ======================================================
       QUIZ BOX
    ====================================================== */

        .quiz-box {

            margin-top: 12px;

            padding: 14px;

            border-radius: 18px;

            background:
                linear-gradient(135deg,
                    rgba(37, 99, 235, 0.18),
                    rgba(124, 58, 237, 0.18));

            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .quiz-question {
            font-weight: 700;
            margin-bottom: 10px;
        }

        .quiz-answer {
            opacity: 0.9;
            line-height: 1.7;
        }

        /* ======================================================
       MEMORY TIP
    ====================================================== */

        .memory-tip {

            margin-top: 12px;

            padding: 14px;

            border-radius: 16px;

            background: rgba(255, 255, 255, 0.08);

            text-align: center;

            font-size: 0.95rem;
        }

        /* ======================================================
       RELATED BADGES
    ====================================================== */

        .related-signs {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 12px;
        }

        .related-badge {

            padding: 10px 14px;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.08);

            font-size: 0.82rem;

            font-weight: 600;
        }

        body.light-mode .related-badge {
            background: #f3f4f6;
        }

        /* ======================================================
       EMPTY
    ====================================================== */

        .empty {

            display: none;

            text-align: center;

            padding: 80px 20px;

            opacity: 0.7;
        }

        /* ======================================================
       FAB
    ====================================================== */

        .scroll-top {

            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 62px;
            height: 62px;

            border-radius: 50%;

            background:
                linear-gradient(135deg,
                    #2563eb,
                    #7c3aed);

            color: #fff;

            font-size: 1.3rem;

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow:
                0 15px 35px rgba(37, 99, 235, 0.4);

            z-index: 999;

            transition: 0.3s ease;
        }

        .scroll-top:hover {
            transform: translateY(-4px);
        }

        /* ======================================================
       ANIMATION
    ====================================================== */

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* ======================================================
       MOBILE
    ====================================================== */

        @media(max-width:768px) {

            .hero {
                padding: 28px 20px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .card-top {
                min-height: 160px;
            }

            .card-top img {
                width: 95px;
                height: 95px;
            }

            .hero-top{
                flex-direction:column;
                align-items:stretch;
            }

            .theme-btn{
                align-self:flex-end;
            }

            @media(max-width:768px){

                .scroll-top{
                    width:54px;
                    height:54px;
                    right:14px;
                    bottom:14px;
                }

            }

        }
    </style>

</head>

/* ======================================================

    ====================================================== */

    function renderSigns(){

      const search =
        searchInput.value.toLowerCase();

      const filtered = fullSigns.filter(sign => {

        const matchesCategory =

          currentCategory === "All" ||

          sign.category === currentCategory;

        const matchesSearch =

          sign.name_en.toLowerCase().includes(search) ||

          sign.name_jp.includes(search) ||

          sign.explanation.toLowerCase().includes(search);

        return matchesCategory && matchesSearch;

      });

      signGrid.innerHTML = "";

      if(filtered.length === 0){

        emptyState.style.display = "block";

      }else{

        emptyState.style.display = "none";

      }

      filtered.forEach(sign => {

        const card =
          document.createElement("div");

        card.className = "card";

        card.innerHTML = `

          <div class="card-top">

            <img
                src="${sign.image}"
                alt="${sign.name_en}"
                loading="lazy"
                onerror="this.src='/static/images/signs/placeholder.png'"
            />

          </div>

          <div class="card-body">

            <div class="category">
              ${sign.category}
            </div>

            <h3 class="sign-title">
              ${sign.name_en}
            </h3>

            <div class="sign-jp">
              ${sign.name_jp}
            </div>

            <p class="description">
              ${sign.explanation}
            </p>

            <button class="expand-btn">
              Learn More
            </button>

            <div class="extra">

              ${generateEducationalContent(sign)}

            </div>

          </div>

        `;

        const expandBtn =
          card.querySelector(".expand-btn");

        const extra =
          card.querySelector(".extra");

        expandBtn.addEventListener("click", () => {

          extra.classList.toggle("open");

          expandBtn.innerText =

            extra.classList.contains("open")

            ? "Ocultar"

            : "Ver Mais";

        });

        signGrid.appendChild(card);

      });

    }

    /* ======================================================
       SEARCH
    ====================================================== */

    searchInput.addEventListener(
      "input",
      renderSigns
    );

    /* ======================================================
       FILTER TABS
    ====================================================== */

    tabs.forEach(tab => {

      tab.addEventListener("click", () => {

        tabs.forEach(t =>
          t.classList.remove("active")
        );

        tab.classList.add("active");

        currentCategory =
          tab.dataset.category;

        renderSigns();

      });

    });

    /* ======================================================
       DARK MODE
    ====================================================== */

    const themeToggle =
      document.getElementById("themeToggle");

    themeToggle.addEventListener("click", () => {

      document.body.classList.toggle(
        "light-mode"
      );

      if(
        document.body.classList.contains(
          "light-mode"
        )
      ){

        themeToggle.innerHTML = "☀️";

      }else{

        themeToggle.innerHTML = "🌙";

      }

    });

    /* ======================================================
